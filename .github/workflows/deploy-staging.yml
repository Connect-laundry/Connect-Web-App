name: Deploy to Staging Server

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url || 'https://staging.simame.me' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Staging Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL || 'https://connect-staging-api.onrender.com/api/v1' }}
          NEXT_PUBLIC_APP_NAME: CONNECT (Staging)

      - name: Trigger Staging Deployment
        id: deploy
        run: |
          echo "🚀 Deploying develop branch to STAGING environment..."
          # Integrate with Vercel / hosting webhook / CLI deployment step here
          # e.g., npx vercel --token ${{ secrets.VERCEL_TOKEN }} --prod=false
          echo "url=https://staging.simame.me" >> $GITHUB_OUTPUT
          echo "✅ Successfully deployed to Staging!"
