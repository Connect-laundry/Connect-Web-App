name: CI Validation Pipeline

on:
  push:
    branches: [ main, develop, 'hotfix/*' ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gatekeeper: production (main) may only receive merges from `develop`
  # (normal releases) or a `hotfix/*` branch (emergency production fixes).
  # This job always reports a status so it can safely be a required check —
  # it only *fails* on a disallowed PR into main.
  enforce-merge-source:
    name: Enforce Merge Source
    runs-on: ubuntu-latest
    steps:
      - name: Restrict who can merge into main
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          echo "Pull request opened from '${HEAD_BRANCH}' into 'main'."
          if [[ "${HEAD_BRANCH}" == "develop" || "${HEAD_BRANCH}" == hotfix/* ]]; then
            echo "✅ '${HEAD_BRANCH}' is allowed to merge into main."
          else
            echo "::error::Only 'develop' or a 'hotfix/*' branch may be merged into 'main'. This PR is from '${HEAD_BRANCH}'. Open it against 'develop' instead."
            exit 1
          fi

      - name: Nothing to enforce
        if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'main') }}
        shell: bash
        run: echo "No merge-source restriction applies to this event."

  validate:
    name: Validate Codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Linting
        run: npm run lint

      - name: Type Checking
        run: npx tsc --noEmit

      - name: Unit Tests
        run: npm test

      - name: Build Application
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://connect-full-backend.onrender.com/api/v1
          NEXT_PUBLIC_APP_NAME: CI-Test

  e2e:
    name: End-to-End Tests
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test
        env:
          NEXT_PUBLIC_API_BASE_URL: https://connect-full-backend.onrender.com/api/v1
          NEXT_PUBLIC_APP_NAME: CI-E2E
          # Add any other required CI envs here

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit Dependencies
        run: npm audit --audit-level=high

      # - name: Secret Scanning
      #   uses: gitleaks/gitleaks-action@v2
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
